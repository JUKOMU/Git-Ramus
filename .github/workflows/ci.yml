name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  quality:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.88.0
          components: rustfmt, clippy
      - uses: ilammy/msvc-dev-cmd@v1
        if: runner.os == 'Windows'
      - run: git --version
      - run: npm ci
      - run: npm audit --audit-level=high
      - run: npm run check
      - run: cargo fmt --manifest-path apps/desktop/src-tauri/Cargo.toml -- --check
      - run: cargo clippy --manifest-path apps/desktop/src-tauri/Cargo.toml --all-targets -- -D warnings
      - run: cargo test --manifest-path apps/desktop/src-tauri/Cargo.toml
      - name: Prove E2E fixture commands are absent from release builds
        run: >-
          cargo test --release --features e2e
          --manifest-path apps/desktop/src-tauri/Cargo.toml
          --lib tests::e2e_seed_fixture_handler_matches_the_debug_feature_boundary
          -- --exact
      - name: Prove Provider E2E fixture commands are absent from release builds
        run: >-
          cargo test --release --features e2e
          --manifest-path apps/desktop/src-tauri/Cargo.toml
          --lib tests::e2e_provider_fixture_handler_matches_the_debug_feature_boundary
          -- --exact
      - run: npm run desktop:build

  node-compat:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 26
          cache: npm
      - run: npm ci
      - run: npm run check

  e2e:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.88.0
      - uses: ilammy/msvc-dev-cmd@v1
        if: runner.os == 'Windows'
      - run: git --version
      - name: Install Linux WebView dependencies
        if: runner.os == 'Linux'
        run: >-
          sudo apt-get update &&
          sudo apt-get install -y
          build-essential
          curl
          file
          libssl-dev
          libwebkit2gtk-4.1-dev
          libayatana-appindicator3-dev
          librsvg2-dev
          libxdo-dev
          wget
          xvfb
      - run: npm ci
      - name: Run Unix Git process-tree cleanup regression
        if: runner.os == 'Linux'
        run: >-
          cargo test
          --manifest-path apps/desktop/src-tauri/Cargo.toml
          --lib
          git::engine::tests::unix_io_timeout_kills_a_descendant_that_keeps_the_output_pipe_open
          -- --exact
      - run: npm run build:e2e --workspace @git-ramus/desktop
      - name: Run Windows E2E
        if: runner.os == 'Windows'
        run: npm run test:e2e --workspace @git-ramus/desktop
      - name: Run Linux E2E
        if: runner.os == 'Linux'
        run: xvfb-run -a npm run test:e2e --workspace @git-ramus/desktop
